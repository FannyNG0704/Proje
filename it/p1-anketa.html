<style>
/* Layout: one form column; each block = a numbered section (real order of the site), each question shows its hint right under the label, a sticky bar shows save state and progress. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#18212e; --muted:#5a6475; --line:#d6dce5;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161f; --surface:#171e2a; --ink:#e6eaf1; --muted:#9aa5b6; --line:#2c3647;

}}
:root[data-theme="dark"]{
  --bg:#11161f; --surface:#171e2a; --ink:#e6eaf1; --muted:#9aa5b6; --line:#2c3647;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:760px;margin:0 auto;padding-block:28px 80px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5vw,34px);margin:4px 0 8px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:clamp(18px,3vw,22px);margin:0;text-wrap:balance}
p{margin:6px 0;max-width:66ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.meter{flex:1 1 180px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stat{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.save{font-family:var(--f-mono);font-size:13px}
.save.ok{color:var(--ok)} .save.warn{color:var(--warn)}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;display:grid;gap:16px}
.shead{display:flex;gap:12px;align-items:baseline}
.num{font-family:var(--f-mono);font-size:13px;color:var(--accent);flex:none}
.q{display:grid;gap:4px;min-width:0}
.q label{font-weight:600}
.star{color:var(--accent);font-weight:700}
.hint{font-size:14px;color:var(--muted);margin:0}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.svc{display:grid;grid-template-columns:1.2fr 1.6fr .8fr;gap:8px}
.svc .h{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:560px){.svc{grid-template-columns:1fr}.svc .h{display:none}.svc input:nth-child(3n+1){margin-top:10px}}
.prices{font-size:14px;border-collapse:collapse;width:100%}
.prices td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.prices td:last-child{font-family:var(--f-mono);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
details{font-size:14px}
summary{cursor:pointer;color:var(--accent)}
.later{border-style:dashed}
.ins{justify-self:start;font:inherit;font-size:14px;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:6px;padding:6px 12px;cursor:pointer}
.ins:hover{background:var(--field)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--field)}
.opt-t{min-width:0}
.opt p{margin:0}
.opt .ua{font-size:15px}
.opt .es{font-size:13px;color:var(--muted);font-style:italic}
.opt .ins{flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.ptable{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.ptable table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.ptable th{font-size:12px;color:var(--muted);text-align:left;padding:8px;background:var(--bg);font-weight:600}
.ptable td{padding:4px;border-top:1px solid var(--line)}
.ptable td:first-child{width:46%}
.ptable input{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:4px;padding:6px 8px}
.ptable input:hover{border-color:var(--line)}
.ptable td:nth-child(3) input,.ptable td:nth-child(4) input{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.del{font:inherit;color:var(--muted);background:none;border:0;cursor:pointer;padding:4px 8px;font-size:18px;line-height:1}
.del:hover{color:var(--warn)}
@media (max-width:560px){.opt{flex-direction:column;align-items:stretch}.opt .ins{justify-self:start;align-self:flex-start}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}

    td.append(inp);
  });
  const td = tr.insertCell(); const del = document.createElement("button"); del.type="button"; del.className="del"; del.textContent="×";
  del.setAttribute("aria-label","Видалити рядок");
  del.addEventListener("click", ()=>{ tr.remove(); form.dispatchEvent(new Event("input")); });
  td.append(del);
  priceBody.append(tr);
}
function readPrices(){ return [...priceBody.rows].map(tr=>[...tr.querySelectorAll("input")].map(i=>i.value.trim())).filter(r=>r.some(Boolean)); }
function renderPrices(rows){ priceBody.replaceChildren(); rows.forEach(priceRow); }

function optsBlock(q, f){
  const box = document.createElement("div"); box.className = "opts";
  q.opts.forEach(([ua, es])=>{
    const o = document.createElement("div"); o.className = "opt";
    const t = document.createElement("div"); t.className = "opt-t";
    const a = document.createElement("p"); a.className="ua"; a.textContent = ua;
    const b = document.createElement("p"); b.className="es"; b.textContent = es;
    t.append(a,b);
    const btn = document.createElement("button"); btn.type="button"; btn.className="ins"; btn.textContent="Вибрати";
    btn.addEventListener("click", ()=>{ f.value = f.value.trim() ? f.value.trimEnd()+" "+es : es; form.dispatchEvent(new Event("input")); });
    o.append(t, btn); box.append(o);
  });
  return box;
}

let n = 0;
for (const sec of SECTIONS){
  n++;
  const s = document.createElement("section");
  const head = document.createElement("div"); head.className = "shead";
  head.innerHTML = `<span class="num">${String(n).padStart(2,"0")}</span><h2></h2>`;
  head.querySelector("h2").textContent = sec.t;
  s.append(head);
  if (sec.svc){
    const intro = document.createElement("p"); intro.className = "hint";
    intro.innerHTML = "Основні групи робіт — ті, що закривають більшість замовлень. Ціна «від» — мінімальна, точна після огляду. Сіре в полях — приклад. <span class='star'>⭐</span> мінімум 4.";
    s.append(intro);
    const fill = document.createElement("button"); fill.type="button"; fill.className="ins";
    fill.textContent = "Вставити приклад у порожні рядки";
    fill.addEventListener("click", ()=>{
      for (let i=0;i<SVC_N;i++) ["n","d","p"].forEach((k,j)=>{ const el=document.getElementById(`svc${i+1}_${k}`); if(!el.value.trim()) el.value=SVC_HINTS[i][j]; });
      form.dispatchEvent(new Event("input"));
    });
    s.append(fill);
    const g = document.createElement("div"); g.className = "svc";
    g.innerHTML = '<span class="h">Послуга</span><span class="h">Що входить</span><span class="h">Ціна «від»</span>';
    for (let i=0;i<SVC_N;i++){
      ["n","d","p"].forEach((k,j)=>{
        const inp = document.createElement("input"); inp.type="text";
        inp.id = `svc${i+1}_${k}`; inp.placeholder = SVC_HINTS[i][j];
        inp.setAttribute("aria-label", `Послуга ${i+1}: ${["назва","що входить","ціна"][j]}`);
        g.append(inp);
      });
    }
    s.append(g);
  }
  if (sec.prices){
    const intro = document.createElement("p"); intro.className = "hint";
    intro.textContent = "Твій прайс: дві ціни — коли матеріал купує клієнт (тільки робота) і коли купуємо ми (з базовим матеріалом). Без IVA. Мінімальні ціни з дослідження по Малазі — орієнтир, міняй як хочеш. Цей прайс потім піде в калькулятор (P2).";
    const row = document.createElement("div"); row.className = "btns";
    const fill = document.createElement("button"); fill.type="button"; fill.className="ins"; fill.textContent="Вставити мінімальні ціни";
    fill.addEventListener("click", ()=>{
      const have = new Set(readPrices().map(r=>r[0].toLowerCase()));
      MIN_PRICES.filter(r=>!have.has(r[0].toLowerCase())).forEach(priceRow);
      form.dispatchEvent(new Event("input"));
    });
    const add = document.createElement("button"); add.type="button"; add.className="ins"; add.textContent="+ Додати роботу";
    add.addEventListener("click", ()=>{ priceRow(); priceBody.lastElementChild.querySelector("input").focus(); });
    row.append(fill, add);
    const wrap = document.createElement("div"); wrap.className = "ptable";
    const t = document.createElement("table");
    t.innerHTML = "<thead><tr><th>Робота</th><th>Од.</th><th>Тільки робота €</th><th>З матеріалом €</th><th></th></tr></thead>";
    t.append(priceBody); wrap.append(t);
    s.append(intro, row, wrap);
  }
  for (const q of sec.q){
    const w = document.createElement("div"); w.className = "q";
    const lab = document.createElement("label"); lab.htmlFor = q.id; lab.textContent = q.l;
    if (q.s){ const st=document.createElement("span"); st.className="star"; st.textContent=" ⭐"; lab.append(st); }
    w.append(lab);
    if (q.h){ const h = document.createElement("p"); h.className="hint"; h.textContent = q.h; w.append(h); }
    const f = document.createElement(q.ta ? "textarea" : "input");
    if (!q.ta) f.type = "text";
    if (q.big) f.style.minHeight = "130px";
    f.id = q.id;
    if (q.opts) w.append(optsBlock(q, f));
    w.append(f);
    if (q.ex){
      const b = document.createElement("button"); b.type="button"; b.className="ins";
      b.textContent = "Вставити текст від Claude";
      b.addEventListener("click", ()=>{ f.value = f.value.trim() ? f.value.trimEnd()+"\n\n"+q.ex : q.ex; form.dispatchEvent(new Event("input")); });
      w.append(b);
    }
    s.append(w);
  }
  form.append(s);
}
const later = document.createElement("section"); later.className="later";
later.innerHTML = '<div class="shead"><span class="num">—</span><h2>Пізніше, перед публікацією</h2></div><p class="hint">Сайт поки тільки для навчання. Коли буде autónomo: ім\'я і NIE для aviso legal, сторінки privacidad і cookies, справжні контакти, домен. Зараз нічого не заповнюй.</p>';
form.append(later);

const fields = [...form.querySelectorAll("input:not(.pr),textarea")];
const starIds = SECTIONS.flatMap(s=>s.q.filter(q=>q.s).map(q=>q.id));
const meter = document.getElementById("meter"), stat = document.getElementById("stat"), saveEl = document.getElementById("save");

function collect(){ const o={}; for (const f of fields){ const v=f.value.trim(); if (v) o[f.id]=f.value; } const p=readPrices(); if (p.length) o.prices=p; return o; }
function apply(o){ if (!o) return; for (const f of fields){ if (typeof o[f.id]==="string") f.value=o[f.id]; } if (Array.isArray(o.prices)) renderPrices(o.prices); }
function progress(){
  const svcDone = Array.from({length:SVC_N},(_,i)=>document.getElementById(`svc${i+1}_n`).value.trim()).filter(Boolean).length;
  const total = starIds.length + 1;
  const done = starIds.filter(id=>document.getElementById(id).value.trim()).length + (svcDone>=4?1:0);
  meter.style.width = Math.round(done/total*100)+"%";
  stat.textContent = `⭐ ${done} / ${total}`;
}
function setSave(t,c){ saveEl.textContent=t; saveEl.className="save "+(c||""); }

const LS="p1-anketa-draft";
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){ return null; } }
function lsSet(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} }

let ref = null, timer = null, writing = false, pending = false, lastSent = "";
async function flush(){
  if (!ref) return;
  if (writing){ pending = true; return; }
  const data = collect(); const js = JSON.stringify(data);
  if (js === lastSent){ setSave("Збережено ✓","ok"); return; }
  writing = true; setSave("Зберігаю…");
  try{ await ref.set({answers:data, updated:Date.now()}); lastSent = js; setSave("Збережено ✓","ok"); }
  catch(e){ setSave("Не зберіглось — збережено лише в цьому браузері","warn"); }
  writing = false;
  if (pending){ pending=false; flush(); }
}
form.addEventListener("input", ()=>{
  progress(); lsSet(collect());
  if (!ref){ setSave("Збережено в цьому браузері","warn"); return; }
  setSave("Пишеш…"); clearTimeout(timer); timer = setTimeout(flush, 1200);
});
form.addEventListener("submit", e=>e.preventDefault());

const draft = lsGet(); if (draft) apply(draft); progress();
setSave(draft ? "Чернетка з браузера" : "Підключаюсь…");

(async()=>{
  try{
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const id = user ? await user.id() : null;
    if (!db || !id){ setSave("Збережено лише в цьому браузері (увійди в Claude, щоб Claude бачив)","warn"); return; }
    ref = db.collection("data/users/"+id).doc("anketa");
    const snap = await ref.get();
    const remote = snap.exists ? (snap.data().answers||{}) : null;
    if (remote && Object.keys(remote).length){
      apply(remote); lastSent = JSON.stringify(collect());
      if (draft){ apply(draft); }
    }
    progress();
    if (JSON.stringify(collect()) !== lastSent) flush(); else setSave("Збережено ✓","ok");
  }catch(e){ setSave("Збережено лише в цьому браузері","warn"); }
})();
</script>
